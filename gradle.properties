# Memoria que usa Gradle al compilar
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Java con el que se ejecuta Gradle (el JDK 25 que ya tienes instalado).
# El mod se compila para Java 21, que es lo que usa Minecraft 1.21.1: Gradle descarga ese JDK solo la primera vez.
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.2

## Versiones del juego
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Versiones de NeoForge: https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.265

## Datos del mod
# id interno: solo minusculas, numeros y _ . No cambiarlo una vez publicado (rompe mundos y configs).
mod_id=magus_elites
# Nombre que vera la gente
mod_name=Magu's Elites
# Licencia: MIT = cualquiera puede usar el codigo citandote. Cambiala antes de publicar si prefieres otra.
mod_license=MIT
# Version: MAYOR.MENOR.ARREGLO (0.x = todavia en desarrollo)
mod_version=0.1.0
# Paquete Java base (tu "dominio" al reves)
mod_group_id=com.magu.maguselites
